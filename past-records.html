<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klinik Pergigian Sofea Taman Tas — Past Records</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="assets/css/past-records.css">
</head>

<body class="h-screen flex overflow-hidden text-slate-800 bg-[#e5e9f0] p-6">

  <!-- App Container Wrapper -->
  <div class="flex flex-1 overflow-hidden bg-white rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.05)] w-full">

    <!-- Sidebar -->
  <aside id="sidebar"
    class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 z-10 transition-all duration-300 ease-in-out px-4 py-6"
    style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
    <div class="flex items-center p-2 border border-slate-200 rounded-lg mb-8 bg-white">
      <div class="w-8 h-8 rounded-md overflow-hidden shrink-0 mr-3 bg-transparent flex items-center justify-center">
        <img src="assets/images/icon.jpg" alt="Logo" class="w-full h-full object-cover rounded-lg">
      </div>
      <div>
        <div class="font-bold text-slate-900 text-[0.9rem]">Klinik Sofea.</div>
        <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold tracking-wide bg-slate-100 text-slate-500 border border-slate-200 mt-1">
          <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span> Dentist
        </div>
      </div>
    </div>

    <div class="text-[0.7rem] font-bold text-slate-400 uppercase tracking-[0.05em] mb-3 pl-2">My Pages</div>
    
    <a href="home-dentist.html" class="flex items-center gap-3 px-3 py-[0.6rem] text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium mb-1 transition text-[0.9rem]">
      <i class="bi bi-house w-5 text-center" style="color: #6366f1;"></i> Home
    </a>
    
    <a href="dentist.html" class="flex items-center gap-3 px-3 py-[0.6rem] text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium mb-1 transition text-[0.9rem]">
      <i class="bi bi-calendar-event w-5 text-center" style="color: #ec4899;"></i> Calendar
    </a>
    
    <a href="past-records.html" class="flex items-center gap-3 px-3 py-[0.6rem] bg-white text-slate-900 shadow-[0_1px_3px_rgba(0,0,0,0.08)] border border-slate-100 rounded-lg font-semibold mb-1 transition text-[0.9rem]">
      <i class="bi bi-clock-history w-5 text-center" style="color: #8b5cf6;"></i> History
    </a>
    
    <div class="flex-1"></div>
    <a href="index.html" class="flex items-center gap-3 px-3 py-[0.6rem] text-slate-600 hover:bg-slate-100 border border-slate-200 rounded-lg font-semibold transition mt-auto text-[0.9rem]" title="Sign Out">
      <i class="bi bi-box-arrow-left w-5 text-center" style="color: #475569;"></i> Sign Out
    </a>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col overflow-hidden bg-white">
    
    <!-- Topbar matching front-desk.html -->
    <div class="px-8 py-6 shrink-0">
      <div class="text-[0.85rem] font-medium text-slate-500">Dashboard / <span class="font-semibold text-slate-900">History</span></div>
      <div class="flex justify-between items-end mt-4">
        <div>
          <h2 class="font-bold text-[1.75rem] text-slate-900 mb-1">Past Records</h2>
          <p class="text-[0.9rem] text-slate-500 m-0">View history of completed or cancelled treatments.</p>
        </div>
      </div>
    </div>

    <!-- Main Content Container matching front-desk.html (.calendar-container) -->
    <main class="flex-1 flex flex-col bg-white overflow-hidden rounded-2xl border border-slate-200 shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)] mx-8 mb-8 mt-2 relative">

      <!-- Hidden access denied block -->
      <section class="access-denied hidden absolute inset-0 flex flex-col items-center justify-center bg-white z-50"
        id="accessDenied">
        <div class="text-center">
          <i class="bi bi-shield-lock text-danger" style="font-size: 3rem;"></i>
          <h2 class="mt-3">Access Denied</h2>
          <p class="text-muted">You do not have permission to view this page with your current role.</p>
          <button class="btn btn-dark mt-2" id="backToIndex">Return to login</button>
        </div>
      </section>

      <section class="flex flex-col h-full" id="dentistView">

        <!-- Records Container -->
        <div class="flex-1 overflow-auto flex flex-col bg-white">

            <!-- Toolbar -->
            <div
              class="p-4 border-b border-slate-200 bg-white flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                  <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </span>
                <input type="text" placeholder="Search patient name, phone, or treatment..." id="searchInput"
                  class="w-full bg-slate-50 text-sm pl-10 pr-4 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
              </div>
              <div class="flex items-center space-x-3">
                <select
                  class="bg-slate-50 border border-slate-200 text-slate-600 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 transition"
                  id="statusFilter">
                  <option value="all">All Status</option>
                  <option value="completed">Completed</option>
                  <option value="cancelled">Cancelled</option>
                </select>
                <input type="date"
                  class="bg-slate-50 border border-slate-200 text-slate-600 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 transition"
                  id="dateFilter">
              </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr
                    class="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wider text-slate-500 font-bold">
                    <th class="px-6 py-3">Date</th>
                    <th class="px-6 py-3">Time</th>
                    <th class="px-6 py-3">Patient Details</th>
                    <th class="px-6 py-3">Treatment</th>
                    <th class="px-6 py-3">Notes</th>
                    <th class="px-6 py-3 text-right">Status</th>
                  </tr>
                </thead>
                <tbody id="recordsTableBody" class="divide-y divide-slate-100">
                  <!-- Mock Data generated by script -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div><!-- End App Container Wrapper -->
  
  <!-- Scripts -->
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/past-records.js"></script>

</body>
</html>
