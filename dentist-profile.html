<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klinik Pergigian Sofea Taman Tas - Dentist Dashboard</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/front-desk.css" />
  <link rel="stylesheet" href="assets/css/dentist-profile.css" />
</head>

<body class="app admin">

  <div class="app-container">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="user-profile">
        <div class="user-avatar" style="background: transparent;">
          <img src="assets/images/icon.jpg" alt="Logo"
            style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
        </div>
        <div>
          <div class="fw-bold" style="font-size: 0.9rem; color: #0f172a;">Klinik Sofea.</div>
          <div style="font-size: 0.7rem; color: #64748b;" data-role-badge>Admin Staff</div>
        </div>
      </div>

      <div class="nav-label">My Pages</div>

      <a href="front-desk.html" class="nav-item">
        <i class="bi bi-grid-1x2" style="color: #6366f1;"></i> Front Desk
      </a>

      <a href="reminders.html" class="nav-item">
        <i class="bi bi-chat-dots" style="color: #ec4899;"></i> Reminders
      </a>

      <a href="dentist-profile.html" class="nav-item active">
        <i class="bi bi-person-badge" style="color: #10b981;"></i> Dentist
      </a>

      <div class="mt-auto">
        <button class="btn btn-light w-100 text-start border d-flex align-items-center" id="logoutBtn"
          style="color: #475569; font-weight: 600;">
          <i class="bi bi-box-arrow-left me-2"></i> Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Topbar -->
      <div class="topbar">
        <div class="breadcrumb-text">Dashboard / <span>Dentist Profile</span></div>
        <div class="header-section">
          <div class="header-title">
            <h2>Dentist Profile</h2>
            <p>View and manage dentist information.</p>
          </div>
        </div>
      </div>

      <!-- Content Area -->
      <div class="content-area dentist-content">
        <div class="profile-card">

          <div class="profile-header">
            <div class="profile-avatar-wrapper">
              <img src="assets/images/default-profile.jpg" alt="Dr. Zar" class="profile-avatar" id="profileImageBorder">
              <span class="profile-status-badge" id="profileLicenseBadge"></span>

              <!-- Camera Overlay to Upload New Photo in Edit Mode -->
              <label for="profileImageUpload" id="profileImageUploadLabel" class="profile-camera-overlay d-none"
                title="Upload New Photo">
                <i class="fa-solid fa-camera fa-xl"></i>
                <span class="upload-overlay-text">Upload Photo</span>
              </label>
              <input type="file" id="profileImageUpload" style="display: none;" accept="image/*">

              <!-- Small Remove / Delete Badge Button (Trash Can Icon fa-trash) -->
              <button type="button" id="deleteAvatarBadgeBtn" class="avatar-delete-badge d-none"
                title="Remove / Delete Photo" aria-label="Remove / Delete Photo">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>

            <div class="profile-info-wrapper">
              <div class="profile-title-row">
                <div>
                  <h2 class="profile-name" id="profileName">Dr. Zar</h2>
                  <p class="profile-role" id="profileRole">Dental Specialist</p>
                </div>

                <div class="d-flex align-items-center gap-2">
                  <button type="button" class="btn-cancel-profile d-none" id="cancelEditProfileBtn">
                    <i class="fa-solid fa-xmark"></i> <span>Cancel</span>
                  </button>
                  <button class="btn-edit-profile" id="editProfileBtn">
                    <i class="fa-solid fa-pen text-slate-400"></i> <span>Edit Profile</span>
                  </button>
                </div>
              </div>

              <p class="profile-description" id="profileDescription">
                Specialist with over 10 years of experience in orthodontics and general dentistry.
              </p>
            </div>
          </div>

          <div class="profile-body">
            <div class="profile-section-header">
              <h3 class="profile-section-title">Personal Information</h3>
              <div class="license-toggle-wrapper">
                <span class="license-label">License Status:</span>
                <label class="relative inline-flex items-center cursor-pointer">
                  <div class="license-badge-pill">
                    <span class="license-badge-dot"></span>
                    <span>Active</span>
                  </div>
                </label>
              </div>
            </div>

            <div class="profile-form-grid">
              <div>
                <label class="form-label" for="inputFullName">Full Name</label>
                <input type="text" id="inputFullName" value="Dr. Zarul Ikhwan" class="form-input" disabled>
              </div>
              <div>
                <label class="form-label" for="inputAge">Age</label>
                <input type="text" id="inputAge" value="34 Years" class="form-input" disabled>
              </div>
              <div>
                <label class="form-label" for="inputEmail">Email Address</label>
                <input type="email" id="inputEmail" value="dr.zar@kliniksofea.com" class="form-input" disabled>
              </div>
              <div>
                <label class="form-label" for="inputPhone">Phone Number</label>
                <input type="tel" id="inputPhone" value="+60 12-345 6789" class="form-input" disabled>
              </div>
              <div>
                <label class="form-label" for="inputLicense">License Number</label>
                <input type="text" id="inputLicense" value="MDC-2018-4921" class="form-input" disabled>
              </div>
              <div>
                <label class="form-label" for="inputJoinDate">Join Date</label>
                <input type="text" id="inputJoinDate" value="October 15, 2019" class="form-input" disabled>
              </div>
            </div>

          </div>
        </div>
      </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/mock-data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/dentist-profile.js"></script>

    <!-- Toast notifications container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" style="z-index: 1060;"></div>

  </div>
</body>

</html>
