<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klinik Pergigian Sofea Taman Tas — Login</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/index.css" />
</head>

<body class="auth">

  <!-- BACKGROUND VIDEO ELEMENT ADDED HERE -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="assets/videos/login.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-icon">
        <img src="assets/images/icon-removebg.jpg">
      </div>
      <h4>Klinik Pergigian Sofea Taman Tas</h4>
      <p class="subtitle">Scheduling &amp; Reminders System</p>

      <form id="loginForm">
        <!-- Role Selection -->
        <div class="role-toggle" id="roleGroup">
          <button type="button" class="role-btn active" data-role="admin">
            <i class="bi bi-person-badge"></i> Admin
          </button>
          <button type="button" class="role-btn" data-role="dentist">
            <i class="bi bi-person-heart"></i> Dentist
          </button>
        </div>

        <div class="mb-3">
          <label class="form-label" for="usernameInput">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="usernameInput" placeholder="Enter username" required
              value="Admin">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="passwordInput">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="passwordInput" placeholder="Enter password" required
              value="password123">
          </div>
        </div>

        <button type="submit" class="btn btn-login">
          Sign In <i class="bi bi-arrow-right ms-2"></i>
        </button>
      </form>

      <div class="footer-note">
        <span class="badge bg-light text-dark border me-1">KPSTS</span> Internal Only
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/app.js"></script>
  <script src="assets/js/index.js"></script>

</body>
  
</html>
